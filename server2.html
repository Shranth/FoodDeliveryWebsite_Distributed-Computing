<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - FoodFast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-primary': '#FF6B6B',
                        'brand-secondary': '#4ECDC4',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">
                    <i class="fas fa-receipt mr-3 text-brand-primary"></i>Order History - Server 2
                </h1>
                <button id="refreshBtn" class="bg-brand-primary text-white px-4 py-2 rounded-lg hover:bg-opacity-90 transition flex items-center">
                    <i class="fas fa-sync mr-2"></i>Refresh Orders
                </button>
            </div>

            <div id="order-history" class="space-y-6"></div>

            <div id="noOrdersMessage" class="hidden text-center bg-white p-8 rounded-lg shadow-md">
                <i class="fas fa-shopping-basket text-6xl text-gray-300 mb-4"></i>
                <h2 class="text-2xl font-semibold text-gray-600">No orders yet</h2>
                <p class="text-gray-500 mt-2">Start ordering delicious food!</p>
            </div>
        </div>
    </div>

    <script>
        function fetchOrders() {
            const orderHistory = document.getElementById("order-history");
            const noOrdersMessage = document.getElementById("noOrdersMessage");
            const refreshBtn = document.getElementById("refreshBtn");

            // Disable refresh button during fetch
            refreshBtn.disabled = true;
            refreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Refreshing...';

            fetch("http://localhost:8083/server2/orders")
                .then(response => response.json())
                .then(orderData => {
                    // Clear previous orders
                    orderHistory.innerHTML = '';
                    
                    const orders = Array.isArray(orderData) ? orderData : [orderData];

                    if (orders.length === 0) {
                        noOrdersMessage.classList.remove('hidden');
                    } else {
                        noOrdersMessage.classList.add('hidden');
                    }

                    orders.forEach(order => {
                        const orderTotal = order.totalAmount;
                        const orderDate = new Date(order.createdAt);

                        const orderDiv = document.createElement("div");
                        orderDiv.classList.add("bg-white", "rounded-lg", "shadow-md", "overflow-hidden", "transition", "hover:shadow-xl");

                        orderDiv.innerHTML = `
                            <div class="p-6 border-b border-gray-200">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <h3 class="text-xl font-semibold text-brand-primary">
                                            <i class="fas fa-shopping-bag mr-2"></i>Order #${order.id}
                                        </h3>
                                        <p class="text-gray-500 text-sm">
                                            <i class="fas fa-calendar-alt mr-1"></i>${orderDate.toLocaleString()}
                                        </p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xl font-bold text-brand-secondary">
                                            ₹${orderTotal.toFixed(2)}
                                        </p>
                                        <p class="text-gray-500 text-sm">
                                            <i class="fas fa-envelope mr-1"></i>${order.email}
                                        </p>
                                    </div>
                                </div>
                            </div>
                            <div class="p-6">
                                <h4 class="text-lg font-medium mb-3 text-gray-700">
                                    <i class="fas fa-list-ul mr-2"></i>Order Items
                                </h4>
                                <ul id="items-${order.id}" class="space-y-2"></ul>
                            </div>
                        `;

                        orderHistory.appendChild(orderDiv);

                        const itemsList = document.getElementById(`items-${order.id}`);

                        order.items.forEach(item => {
                            const li = document.createElement("li");
                            li.classList.add("flex", "justify-between", "bg-gray-100", "p-3", "rounded-md");
                            li.innerHTML = `
                                <div>
                                    <span class="font-semibold text-gray-800">${item.name}</span>
                                    <span class="text-gray-500 ml-2">x ${item.quantity}</span>
                                </div>
                                <span class="font-bold text-brand-primary">₹${(item.price * item.quantity).toFixed(2)}</span>
                            `;
                            itemsList.appendChild(li);
                        });
                    });
                })
                .catch(error => {
                    console.error("Error fetching orders:", error);
                    orderHistory.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                            <strong class="font-bold">Oops! </strong>
                            <span class="block sm:inline">Unable to fetch orders. Please try again later.</span>
                        </div>
                    `;
                })
                .finally(() => {
                    // Re-enable refresh button
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = '<i class="fas fa-sync mr-2"></i>Refresh Orders';
                });
        }

        // Initial fetch
        fetchOrders();

        // Add event listener to refresh button
        document.getElementById("refreshBtn").addEventListener("click", fetchOrders);
    </script>
</body>
</html>
