<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Light Mode Colors */
            --primary-color: #FF6B00;
            --primary-dark: #E05A00;
            --primary-light: #FFF0E6;
            --text-color: #333333;
            --bg-color: #f9f9f9;
            --card-bg: white;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            --input-bg: white;
            --input-border: #ddd;
            --input-focus: rgba(255, 107, 0, 0.1);
            --error-color: #e74c3c;
            --success-color: #2ecc71;
            --accent-gradient: linear-gradient(135deg, #FF6B00, #FF9248);
            --button-shadow: 0 4px 15px rgba(255, 107, 0, 0.2);
            --food-item-bg: rgba(255, 107, 0, 0.05);
            --food-item-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            --footer-text: #777;
        }

        [data-theme="dark"] {
            /* Dark Mode Colors */
            --primary-color: #7B68EE;  /* Medium slate blue */
            --primary-dark: #9370DB;   /* Medium purple */
            --primary-light: #241E4E;  /* Dark purple */
            --text-color: #E6E6E6;
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            --input-bg: #2A2A2A;
            --input-border: #3A3A3A;
            --input-focus: rgba(123, 104, 238, 0.1);
            --error-color: #e74c3c;
            --success-color: #2ecc71;
            --accent-gradient: linear-gradient(135deg, #7B68EE, #9370DB);
            --button-shadow: 0 4px 15px rgba(123, 104, 238, 0.3);
            --food-item-bg: rgba(123, 104, 238, 0.08);
            --food-item-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            --footer-text: #999;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }
        
        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        /* Full-page dynamic background */
        .login-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .bg-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: var(--accent-gradient);
            clip-path: polygon(0 70%, 100% 40%, 100% 100%, 0% 100%);
            opacity: 0.3;
        }
        
        .bg-waves:nth-child(2) {
            clip-path: polygon(0 80%, 100% 60%, 100% 100%, 0% 100%);
            opacity: 0.2;
            animation: wave-motion 15s infinite ease-in-out alternate;
        }
        
        .bg-waves:nth-child(3) {
            clip-path: polygon(0 90%, 100% 80%, 100% 100%, 0% 100%);
            opacity: 0.1;
            animation: wave-motion 18s infinite ease-in-out alternate-reverse;
        }
        
        /* Food item decorations */
        .food-decoration {
            position: absolute;
            z-index: -1;
        }
        
        .food-item {
            position: absolute;
            background-color: var(--food-item-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--food-item-shadow);
            color: var(--primary-color);
        }
        
        .food-item-1 {
            top: 15%;
            left: 10%;
            width: 100px;
            height: 100px;
            animation: float 10s infinite ease-in-out;
        }
        
        .food-item-2 {
            top: 60%;
            left: 15%;
            width: 70px;
            height: 70px;
            animation: float 12s infinite ease-in-out 1s;
        }
        
        .food-item-3 {
            top: 25%;
            right: 15%;
            width: 80px;
            height: 80px;
            animation: float 11s infinite ease-in-out 2s;
        }
        
        .food-item-4 {
            bottom: 20%;
            right: 10%;
            width: 120px;
            height: 120px;
            animation: float 13s infinite ease-in-out 3s;
        }
        
        .food-item i {
            font-size: 2.5rem;
        }
        
        .food-item-2 i, .food-item-3 i {
            font-size: 1.8rem;
        }
        
        /* Main content */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        .login-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 500px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            position: relative;
        }
        
        .login-food-showcase {
            flex: 1.2;
            background: var(--accent-gradient);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: white;
        }
        
        .food-showcase-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        
        .food-showcase-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z'%3E%3C/path%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }
        
        .food-marquee {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
        }
        
        .food-icon-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            animation: pulse 3s infinite alternate;
        }
        
        .food-icon-circle:nth-child(even) {
            animation-delay: 1.5s;
        }
        
        .food-icon-circle:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }
        
        .food-icon-circle i {
            font-size: 1.8rem;
        }
        
        .brand-logo {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .brand-tagline {
            font-size: 1.2rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        /* Login form side */
        .login-form-wrapper {
            flex: 1;
            background: var(--card-bg);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .login-header {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .login-header h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }
        
        .login-header h2::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 50px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 2px;
        }
        
        .login-header p {
            color: var(--footer-text);
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--input-focus);
        }
        
        .input-icon {
            position: absolute;
            top: 39px;
            left: 15px;
            color: var(--primary-color);
            opacity: 0.7;
        }
        
        .forgot-password {
            text-align: right;
            margin-top: -15px;
            margin-bottom: 20px;
        }
        
        .forgot-password a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .forgot-password a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
        
        .login-btn {
            background: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: var(--button-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.25);
        }
        
        .login-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(255, 107, 0, 0.15);
        }
        
        [data-theme="dark"] .login-btn:hover {
            box-shadow: 0 6px 20px rgba(123, 104, 238, 0.3);
        }
        
        [data-theme="dark"] .login-btn:active {
            box-shadow: 0 2px 10px rgba(123, 104, 238, 0.2);
        }
        
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: var(--footer-text);
        }
        
        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--input-border);
        }
        
        .separator::before {
            margin-right: 10px;
        }
        
        .separator::after {
            margin-left: 10px;
        }
        
        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }
        
        .social-btn:active {
            transform: translateY(1px);
        }
        
        .signup-link {
            text-align: center;
            margin-top: 25px;
            padding: 15px;
            background-color: var(--input-bg);
            border-radius: 10px;
            color: var(--footer-text);
        }
        
        .signup-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            position: relative;
        }
        
        .signup-link a::after {
            content: "";
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }
        
        .signup-link a:hover::after {
            width: 100%;
        }
        
        #login-message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
            opacity: 0;
        }
        
        #login-message.active {
            opacity: 1;
        }
        
        .success-message {
            background-color: rgba(46, 204, 113, 0.1);
            color: var(--success-color);
            border-left: 4px solid var(--success-color);
        }
        
        .error-message {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--error-color);
            border-left: 4px solid var(--error-color);
        }

        /* Theme toggle button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }

        .theme-toggle:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        .theme-toggle i {
            font-size: 1.5rem;
        }
        
        /* Footer */
        .page-footer {
            padding: 15px 0;
            text-align: center;
            color: var(--footer-text);
            font-size: 0.9rem;
            background: var(--accent-gradient);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-top: 20px;
        }
        
        .page-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }
        
        .page-footer a:hover {
            text-decoration: underline;
        }
        
        /* Responsive design */
        @media (max-width: 992px) {
            .login-container {
                max-width: 700px;
            }
            
            .food-icon-circle {
                width: 50px;
                height: 50px;
            }
            
            .food-icon-circle i {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 500px;
            }
            
            .login-food-showcase {
                padding: 30px 20px;
            }
            
            .food-marquee {
                margin-top: 20px;
                gap: 15px;
            }
            
            .login-form-wrapper {
                padding: 30px 20px;
            }
            
            .food-item {
                opacity: 0.6;
            }

            /* Adjust theme toggle for mobile */
            .theme-toggle {
                width: 40px;
                height: 40px;
                top: 10px;
                right: 10px;
            }

            .theme-toggle i {
                font-size: 1.2rem;
            }
        }
        
        @media (max-width: 480px) {
            .social-login {
                flex-direction: column;
                gap: 10px;
            }
            
            .login-container {
                border-radius: 15px;
            }
            
            .login-header h2 {
                font-size: 1.5rem;
            }
            
            .food-item-1, .food-item-4 {
                display: none;
            }
        }
        
        /* Animation keyframes */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        
        @keyframes wave-motion {
            0% { transform: translateX(0); }
            50% { transform: translateX(-5%); }
            100% { transform: translateX(0); }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .bg-waves, .food-item, .food-icon-circle {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Dynamic background -->
    <div class="login-background">
        <div class="bg-waves"></div>
        <div class="bg-waves"></div>
        <div class="bg-waves"></div>
    </div>
    
    <!-- Decorative food items -->
    <div class="food-decoration">
        <div class="food-item food-item-1">
            <i class="fas fa-pizza-slice"></i>
        </div>
        <div class="food-item food-item-2">
            <i class="fas fa-hamburger"></i>
        </div>
        <div class="food-item food-item-3">
            <i class="fas fa-coffee"></i>
        </div>
        <div class="food-item food-item-4">
            <i class="fas fa-ice-cream"></i>
        </div>
    </div>
    
    <div class="main-container">
        <div class="login-container">
            <div class="login-food-showcase">
                <div class="food-showcase-pattern"></div>
                <div class="food-showcase-content">
                    <div class="brand-logo">
                        <i class="fas fa-utensils"></i>
                    </div>
                    <h2>QuickBite</h2>
                    <p class="brand-tagline">Ready to satisfy your cravings?</p>
                    
                    <div class="food-marquee">
                        <div class="food-icon-circle">
                            <i class="fas fa-hamburger"></i>
                        </div>
                        <div class="food-icon-circle">
                            <i class="fas fa-pizza-slice"></i>
                        </div>
                        <div class="food-icon-circle">
                            <i class="fas fa-coffee"></i>
                        </div>
                        <div class="food-icon-circle">
                            <i class="fas fa-fish"></i>
                        </div>
                        <div class="food-icon-circle">
                            <i class="fas fa-drumstick-bite"></i>
                        </div>
                        <div class="food-icon-circle">
                            <i class="fas fa-ice-cream"></i>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="login-form-wrapper">
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to continue to your account</p>
                </div>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                    
                    <div class="forgot-password">
                        <a href="#">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="login-btn">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                    
                    <div id="login-message"></div>
                </form>
                
                <div class="separator">OR</div>
                
                <div class="social-login">
                    <button class="social-btn">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>
                
                <div class="signup-link">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="page-footer">
        &copy; 2025 QuickBite. All rights reserved. <a href="terms.html">Terms</a> | <a href="privacy.html">Privacy</a>
    </footer>
    
    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = themeToggle.querySelector('i');
        
        // Check for saved theme preference or use preferred color scheme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        
        // Toggle theme function
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            }
        });
        





        document.getElementById("login-form").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    fetch(`http://localhost:8080/users/login?email=${email}&password=${password}`, {
        method: "POST"
    })
    .then(response => response.text())
    .then(data => {
        showMessage(data, data.includes("successful") ? "success" : "error");

        if (data.includes("successful")) {
            localStorage.setItem("userEmail", email); // Store session
            setTimeout(() => { 
                window.location.href = "Website1.html"; 
            }, 2500);  // Increased delay to show success message
        }
    })
    .catch(error => {
        console.error("Error:", error);
        showMessage("An error occurred. Please try again.", "error");
    });
});

// Function to show login messages
function showMessage(message, type) {
    const loginMessage = document.getElementById("login-message");
    loginMessage.textContent = message;
    loginMessage.className = type === "success" ? "success-message" : "error-message";
    loginMessage.style.color = type === "success" ? "green" : "red";
    loginMessage.classList.add("active");

    setTimeout(() => {
        loginMessage.classList.remove("active");
    }, 5000); // Keep message visible for 5 seconds
}

    </script>
